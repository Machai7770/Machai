<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Assignment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  </head>
  <body>
    <div class="container">
      <h1 class="text-center bg-warning p-3 rounded-5">I lost my chain</h1>
<img src="chain.jpg" alt="Chain" class="img-fluid mx-auto d-block">

    <style>
      body {
        background-color: lightblue;
      }
    </style>
    <input type="text" class="form-control" placeholder="Your Email">
    <br>

     <input type="text" class="form-control" placeholder="Address for chain">
     <br>
    <button type="button" class="btn-solid theme-primary">SEND</button>
<button type="button" class="btn-solid theme-info">INFO</button>


<div id="carouselStacked" class="carousel slide">
  <div class="d-flex justify-content-between align-items-center">
    <h5 class="mb-0"></h5>
    <div>
      <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselStacked" data-bs-slide="prev">
        <span class="carousel-icon-prev" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselStacked" data-bs-slide="next">
        <span class="carousel-icon-next" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
    
  </div>
  
  <div class="carousel-inner rounded-5">
    <div class="carousel-item active">
      <img src="chain2.jpg" class="d-block w-100" alt="100">
    </div>
    <div class="carousel-item">
      <img src="chain3.jpg" class="d-block w-100" alt="100">
    </div>
    <div class="carousel-item">
      <img src="chain4.jpg" class="d-block w-100" alt="100">
    </div>
  </div>
</div>
</div>
  </body>
      <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

</html>
